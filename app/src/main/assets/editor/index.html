<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Thor IDE</title>
<style>
  :root {
    --bg: #14171f; --panel: #1b1f2a; --panel2: #222736; --line: #2c3245;
    --fg: #d7dbe6; --dim: #7f8799; --acc: #3dd6c6; --warn: #f5b942; --err: #ff6b6b;
    --kw: #c792ea; --str: #c3e88d; --num: #f78c6c; --com: #697089; --tag: #82aaff; --attr: #ffcb6b;
    --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --fs: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; }
  button:active { background: var(--line); }
  button.acc { background: var(--acc); color: #0b0f14; border-color: var(--acc); font-weight: 600; }
  button.warn { background: var(--warn); color: #0b0f14; border-color: var(--warn); font-weight: 600; }
  #project { max-width: 36vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font: inherit; max-width: 36vw; }

  #topbar { display: flex; gap: 5px; align-items: center; padding: 5px 6px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  @media (max-width: 520px) { #topbar .sp { display: none; } button { padding: 5px 8px; } select { max-width: 30vw; } #status { display: none; } .bk-hint { display: none; } .bk-step .bk-num { min-width: 40px; } .bk-step button { min-width: 26px; padding: 4px 5px; } }
  #topbar .sp { flex: 1; }
  #status { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #status.saved { color: var(--acc); }

  #tabs { display: flex; gap: 2px; padding: 4px 8px 0; background: var(--panel); overflow-x: auto; border-bottom: 1px solid var(--line); }
  .tab { padding: 6px 10px; border-radius: 6px 6px 0 0; background: var(--panel2); color: var(--dim); white-space: nowrap; border: 1px solid var(--line); border-bottom: none; }
  .tab.active { background: var(--bg); color: var(--fg); }
  .tab .dot { color: var(--warn); margin-left: 4px; }
  .tab.add { color: var(--acc); }

  #editor { position: relative; flex: 1; min-height: 0; display: flex; font-family: var(--mono); font-size: var(--fs); line-height: 1.45; }
  #gutter { width: 44px; padding: 8px 6px 8px 0; text-align: right; color: var(--dim); background: var(--panel); border-right: 1px solid var(--line); overflow: hidden; user-select: none; white-space: pre; }
  #scroller { position: relative; flex: 1; overflow: auto; }
  #hl, #code { margin: 0; padding: 8px 10px; font: inherit; line-height: inherit; white-space: pre; tab-size: 2; min-width: 100%; min-height: 100%; }
  #hl { position: absolute; inset: 0; pointer-events: none; color: var(--fg); }
  #code { position: relative; display: block; width: 100%; height: 100%; background: transparent; color: transparent; caret-color: var(--acc); border: 0; outline: 0; resize: none; overflow: hidden; }
  #code::selection { background: rgba(61,214,198,.25); }
  .kw { color: var(--kw); } .str { color: var(--str); } .num { color: var(--num); } .com { color: var(--com); font-style: italic; } .tag { color: var(--tag); } .attr { color: var(--attr); } .pun { color: #89ddff; }

  #console { height: 120px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; }
  #console.collapsed { height: 28px; }
  #console header { display: flex; align-items: center; gap: 8px; padding: 3px 8px; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--line); }
  #console header button { padding: 1px 8px; font-size: 11px; }
  #log { flex: 1; overflow: auto; font-family: var(--mono); font-size: 12px; padding: 4px 8px; white-space: pre-wrap; word-break: break-word; }
  #log .l { padding: 1px 0; border-bottom: 1px dotted #262b3a; }
  #log .tag { display: inline-block; min-width: 46px; color: var(--dim); }
  #log .error { color: var(--err); } #log .warning { color: var(--warn); } #log .msg { color: var(--acc); }
  #evalrow { display: flex; gap: 4px; padding: 4px 8px; border-top: 1px solid var(--line); }
  #evalrow input { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-family: var(--mono); }

  /* on-screen keyboard */
  #kbd { display: none; background: var(--panel); border-top: 1px solid var(--line); padding: 4px; user-select: none; }
  #kbd.on { display: block; }
  .krow { display: flex; gap: 3px; margin-bottom: 3px; }
  .k { flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; font-family: var(--mono); font-size: 15px; }
  .k:active, .k.held { background: var(--acc); color: #0b0f14; }
  .k.w { flex: 1.6; } .k.ww { flex: 2.2; } .k.space { flex: 5; }
  .k.fn { font-family: system-ui, sans-serif; font-size: 12px; color: var(--dim); }

  /* dialogs */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; }
  #modal.on { display: flex; }
  #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 300px; max-width: 90vw; }
  #modal h3 { margin: 0 0 10px; font-size: 14px; }
  #modal input, #modal select { width: 100%; margin-bottom: 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 7px; font: inherit; }
  #modal .row { display: flex; gap: 6px; justify-content: flex-end; }
  #modal .list button { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
  .muted { color: var(--dim); font-size: 11px; }

  /* controller focus ring */
  .gp-focus, button:focus-visible, select:focus-visible, .tab:focus-visible { outline: 2px solid var(--acc) !important; outline-offset: 1px; box-shadow: 0 0 0 4px rgba(61,214,198,.25); }

  /* mode toggle */
  #btnMode.blocks { background: var(--kw); color: #0b0f14; border-color: var(--kw); font-weight: 600; }

  /* block editor */
  #blocks { flex: 1; min-height: 0; display: none; flex-direction: column; background: var(--bg); }
  #blocks.on { display: flex; }
  .bk-tabs { display: flex; gap: 4px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; }
  .bk-tab { padding: 8px 14px; font-size: 14px; }
  .bk-tab.on { background: var(--acc); color: #0b0f14; border-color: var(--acc); font-weight: 600; }
  .bk-hint { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; }
  .bk-body { flex: 1; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .bk-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .bk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .bk-sp { flex: 1; }
  .bk-kw { font-weight: 700; font-size: 11px; letter-spacing: .08em; color: var(--warn); min-width: 42px; }
  .bk-event .bk-when { background: var(--panel2); border-radius: 8px; padding: 6px; }
  .bk-trigger { background: var(--warn); color: #0b0f14; border-color: var(--warn); font-weight: 600; }
  .bk-atype { background: var(--tag); color: #0b0f14; border-color: var(--tag); font-weight: 600; }
  .bk-cond [data-k="type"] { background: var(--kw); color: #0b0f14; border-color: var(--kw); font-weight: 600; }
  .bk-actions, .bk-conds { display: flex; flex-direction: column; gap: 4px; padding-left: 14px; }
  .bk-nest { margin-left: 24px; border-left: 2px solid var(--line); padding-left: 8px; display: flex; flex-direction: column; gap: 4px; }
  .bk-chip { background: var(--bg); border-color: var(--line); padding: 5px 8px; }
  .bk-chip small { color: var(--dim); margin-right: 3px; }
  .bk-chip.bk-value { color: var(--str); }
  .bk-name { font-weight: 700; font-size: 14px; }
  .bk-lbl { color: var(--dim); font-size: 11px; }
  .bk-swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .bk-step { display: inline-flex; align-items: center; gap: 2px; background: var(--bg); border-radius: 6px; padding: 2px; }
  .bk-step small { color: var(--dim); padding: 0 4px; }
  .bk-step button { padding: 5px 7px; min-width: 32px; }
  .bk-step .bk-num { min-width: 52px; font-family: var(--mono); color: var(--num); }
  .bk-color { width: 28px; height: 28px; padding: 0; border: 2px solid transparent; }
  .bk-color.on { border-color: #fff; }
  .bk-off { color: var(--dim); }
  .bk-danger { color: var(--err); }
  .bk-add { align-self: flex-start; background: var(--acc); color: #0b0f14; border-color: var(--acc); font-weight: 600; padding: 8px 14px; }
  .bk-mini { align-self: flex-start; font-size: 12px; padding: 3px 8px; color: var(--acc); }
  .bk-help { color: var(--dim); font-size: 12px; line-height: 1.5; display: block; }
  .bk-picklist { max-height: 60vh; overflow: auto; }
  .bk-keypad { display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; }
  .bk-keypad button { height: 48px; font-size: 18px; font-family: var(--mono); }
  .bk-kpv { grid-column: 1 / -1; font-family: var(--mono); font-size: 22px; text-align: right; padding: 6px 10px; background: var(--bg); border-radius: 6px; color: var(--num); }
  #modal .box.wide { min-width: 360px; }
  #modal .box { max-height: 92vh; overflow: auto; }

  /* scene preview */
  .bk-preview { position: relative; width: 100%; max-width: 460px; background: #000; border-radius: 8px; overflow: hidden; touch-action: none; }
  .pv-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .pv-hs { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 9px; color: #fff; text-shadow: 0 1px 2px #000; cursor: grab; box-sizing: border-box; overflow: hidden; }
  .pv-hs img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .pv-hs span { position: relative; z-index: 1; }
  .pv-hs.sel { outline: 2px solid #fff; box-shadow: 0 0 0 3px rgba(61,214,198,.6); }
  .pv-hs.ghost { opacity: .35; }
  .bk-selected { outline: 2px solid var(--acc); }
  .bk-scenebar { padding: 4px 0; }

  /* Scratch-style blocks */
  .scr { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 14px; }
  .blk { color: #fff; border-radius: 10px; padding: 6px 8px; margin: 3px 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 0 rgba(0,0,0,.35); max-width: 100%; box-sizing: border-box; }
  .blk.hat { background: #ffbf00; color: #1a1400; border-radius: 22px 22px 10px 10px; flex-direction: row; align-items: center; gap: 8px; padding: 10px 12px; min-width: 220px; }
  .blk-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .blk .chip { background: #fff; color: #222; border: 0; border-radius: 14px; padding: 4px 10px; font: inherit; font-weight: 500; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blk .chip.chip-text { background: #fff7d6; }
  .blk .chip.chip-cond { background: #e9f5e9; border-radius: 6px; }
  .blk .blk-menu, .blk.hat .blk-menu { background: rgba(0,0,0,.2); color: inherit; border: 0; border-radius: 6px; padding: 2px 8px; margin-left: auto; font-size: 14px; }
  .stack { display: flex; flex-direction: column; align-items: flex-start; padding-left: 14px; border-left: 4px solid rgba(255,255,255,.25); margin: 2px 0 2px 6px; min-width: 120px; }
  .scr > .stack { border-left-color: var(--line); margin-left: 10px; }
  .blk-add { background: var(--panel2); color: var(--acc); border: 1px dashed var(--acc); border-radius: 8px; padding: 2px 14px; font-size: 16px; line-height: 1; margin: 3px 0; }
  .blk-sub { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .85; margin-top: 2px; }
  .blk-optrow { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .blk-mini { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 8px; padding: 3px 10px; font-size: 12px; align-self: flex-start; }
  .cblk { padding-bottom: 8px; }

  /* palette */
  .pal { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow: auto; }
  .pal-cat { border-left: 4px solid; padding-left: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pal-title { width: 100%; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .pal-blk { color: #fff; border: 0; border-radius: 10px; padding: 6px 10px; font-weight: 600; font-size: 12px; text-align: left; }
  .hat-pick { background: #ffbf00 !important; color: #1a1400 !important; border-radius: 16px 16px 6px 6px !important; font-weight: 600; }

  /* built-in text keyboard */
  .tk { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; user-select: none; }
  .tk-row { display: flex; gap: 4px; }
  .tk-k { flex: 1; height: 38px; font-size: 15px; padding: 0; min-width: 0; }
  .tk-k.tk-space { flex: 5; }
  .tk-k.on { background: var(--acc); color: #0b0f14; }
  .bk-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; background: #000; }
  .bk-media { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 50vh; overflow: auto; margin-bottom: 8px; }
  .bk-mediabtn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; }
  .bk-mediabtn img, .bk-mediabtn video { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background: #000; }
  .bk-mediabtn span { font-size: 10px; max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<div id="topbar">
  <button id="project" title="Switch project">…</button>
  <button id="btnProjMenu" title="Project actions">&#8942;</button>
  <button id="btnRun" class="acc" title="Reload preview on the other screen">&#9654; Run</button>
  <button id="btnRunDual" class="warn" title="Run index.html on top + bottom.html on bottom">&#9654;&#9654; Dual</button>
  <button id="btnSave" title="Save (also auto-saves)">Save</button>
  <button id="btnMode" title="Switch between block editor and code editor (SELECT)">Blocks</button>
  <span class="sp"></span>
  <span id="status">ready</span>
  <button id="btnKbd" title="On-screen keyboard">&#9000;</button>
  <button id="btnSwap" title="Move the editor to the other screen">&#8645;</button>
  <button id="btnMore" title="More">&#9776;</button>
</div>

<div id="tabs"></div>

<div id="editor">
  <div id="gutter">1</div>
  <div id="scroller">
    <pre id="hl"></pre>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
  </div>
</div>

<div id="blocksHost"></div>
<div id="kbd"></div>

<div id="console">
  <header>
    <span id="conTitle">console</span>
    <span class="sp" style="flex:1"></span>
    <button id="btnClear">clear</button>
    <button id="btnCon">&#9660;</button>
  </header>
  <div id="log"></div>
  <div id="evalrow"><input id="evalIn" placeholder="run JS in the preview… e.g. document.title"><button id="btnEval">&#9166;</button></div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>

<script src="adv.js"></script>
<script src="nav.js"></script>
<script>
/* ============================================================ bridge */
const N = window.ThorIDE || null; // native bridge (absent when opened in a desktop browser for testing)
const Native = {
  listProjects: () => N ? JSON.parse(N.listProjects()) : JSON.parse(localStorage.__p || '["demo"]'),
  listFiles:    (p) => N ? JSON.parse(N.listFiles(p)) : Object.keys(mem(p)).map(path => ({path})),
  read:         (p, f) => N ? N.readFile(p, f) : (mem(p)[f] || ''),
  write:        (p, f, c) => { if (N) return N.writeFile(p, f, c); const m = mem(p); m[f] = c; localStorage['__f_' + p] = JSON.stringify(m); return true; },
  del:          (p, f) => { if (N) return N.deleteFile(p, f); const m = mem(p); delete m[f]; localStorage['__f_' + p] = JSON.stringify(m); return true; },
  rename:       (p, a, b) => { if (N) return N.renameFile(p, a, b); const m = mem(p); m[b] = m[a]; delete m[a]; localStorage['__f_' + p] = JSON.stringify(m); return true; },
  createProject:(n, t) => { if (N) return N.createProject(n, t); const l = Native.listProjects(); l.push(n); localStorage.__p = JSON.stringify(l); mem(n); Native.write(n, 'index.html', '<h1>' + n + '</h1>'); return true; },
  deleteProject:(n) => { if (N) return N.deleteProject(n); localStorage.__p = JSON.stringify(Native.listProjects().filter(x => x !== n)); delete localStorage['__f_' + n]; return true; },
  current:      () => N ? N.currentProject() : (localStorage.__cur || Native.listProjects()[0]),
  setProject:   (n) => { if (N) N.setProject(n); else localStorage.__cur = n; },
  screens:      () => N ? JSON.parse(N.screens()) : {dual: false, mode: 'EDIT'},
  run:          () => N ? N.run() : log('info', 'editor', '(desktop test) run'),
  runDual:      () => N && N.runDual(),
  swap:         () => N && N.swapScreens(),
  toast:        (m) => N ? N.toast(m) : console.log(m),
  evalInPreview:(js) => N ? N.evalInPreview(js) : log('info', 'editor', '(desktop test) eval: ' + js),
  projectsDir:  () => N ? N.projectsDir() : '(browser localStorage)',
  readAsset:    (p) => N ? N.readAsset(p) : (window.__ASSETS__ && window.__ASSETS__[p]) || '',
  importMedia:  () => N ? N.importMedia() : log('info', 'editor', '(desktop test) import not available'),
  fileUrl:      (p, f) => N ? N.fileUrl(p, f) : '',
  canExport:    () => !!(N && N.canExport && N.canExport()),
  exportApk:    (p, label) => N && N.exportApk(p, label),
  installApk:   (name) => N && N.installApk(name),
};
function mem(p) { return JSON.parse(localStorage['__f_' + p] || '{}'); }

/* events pushed from native: ThorEvents.emit(name, payload) */
window.ThorEvents = {
  emit(name, payload) {
    if (name === 'console') log(payload.level, payload.screen, payload.msg + (payload.src ? '   (' + payload.src + ':' + payload.line + ')' : ''));
    else if (name === 'evalResult') log('info', 'eval', payload);
    else if (name === 'screens') updateScreens(payload);
    else if (name === 'back') { if (modalOpen()) closeModal(); }
    else if (name === 'exported') onExported(payload);
    else if (name === 'imported') {
      if (!payload.ok) { Native.toast('Import failed'); return; }
      files = Native.listFiles(project).map(f => f.path);
      setStatus('imported ' + payload.path, 'saved');
      if (window.ThorBlocks && ThorBlocks.isOpen()) ThorBlocks.onImported(payload.path);
    }
  }
};

/* ============================================================ state */
const $ = (id) => document.getElementById(id);
const code = $('code'), hl = $('hl'), gutter = $('gutter'), scroller = $('scroller');
let project = null, files = [], open = [], active = null;
const dirty = new Set();
const drafts = {};          // path -> unsaved text
let saveTimer = null;

function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = cls || ''; }

/* ---------------- projects */
function loadProjects() {
  const list = Native.listProjects();
  project = Native.current() || list[0] || null;
  if (project && !list.includes(project)) project = list[0] || null;
  $('project').textContent = project || '(no project)';
  loadFiles();
}
/* the project list is a tap-list, not a <select>: WebView's native dropdown can't open on the bottom screen */
function projectPicker() {
  const list = Native.listProjects();
  ThorBlocks.pick('Project', [...list.map(p => [p, (p === project ? '● ' : '') + p]), ['__new', '+ New project…']], (v) => {
    if (v === '__new') newProjectDialog();
    else if (v !== project) { switchProject(v); $('project').textContent = v; }
  });
}
function switchProject(p) {
  flushSave();
  project = p; Native.setProject(p);
  open = []; active = null; dirty.clear();
  loadFiles();
}
function loadFiles() {
  files = project ? Native.listFiles(project).map(f => f.path) : [];
  const want = JSON.parse(localStorage['__open_' + project] || '[]').filter(f => files.includes(f));
  open = want.length ? want : files.filter(f => /^(index\.html|bottom\.html|app\.js|style\.css)$/.test(f));
  if (!open.length && files.length) open = [files[0]];
  active = localStorage['__active_' + project];
  if (!open.includes(active)) active = open[0] || null;
  renderTabs(); showFile(active);
  setMode(files.includes('adventure.json') ? 'blocks' : 'code');
}

/* ---------------- blocks / code mode */
let mode = 'code';
function setMode(m) {
  mode = m;
  const blocksOk = files.includes('adventure.json');
  $('btnMode').style.display = blocksOk ? '' : 'none';
  $('btnMode').textContent = m === 'blocks' ? 'Code' : 'Blocks';
  $('btnMode').classList.toggle('blocks', m === 'blocks');
  $('editor').style.display = m === 'blocks' ? 'none' : '';
  $('tabs').style.display = m === 'blocks' ? 'none' : '';
  $('btnKbd').style.display = m === 'blocks' ? 'none' : '';
  if (m === 'blocks') { $('kbd').classList.remove('on'); ThorBlocks.open(project, Native.read(project, 'adventure.json')); $('blocksHost').appendChild(ThorBlocks.element); ThorBlocks.element.classList.add('on'); }
  else { ThorBlocks.element.classList.remove('on'); ThorBlocks.close(); if (active) showFile(active); }
}
$('btnMode').onclick = () => setMode(mode === 'blocks' ? 'code' : 'blocks');
window.ThorBlocksHost = {
  mediaFiles: () => files.filter(isMedia),
  mediaUrl: (f) => Native.fileUrl(project, f),
  importMedia: () => Native.importMedia(),
  toast: (m) => Native.toast(m),
  save(file, content) { Native.write(project, file, content); if (!files.includes(file)) { files.push(file); files.sort(); } if (active === file) { delete drafts[file]; showFile(file); } setStatus('saved ' + new Date().toLocaleTimeString(), 'saved'); },
};
window.ThorNav = {
  nextTab() { if (mode === 'blocks') ThorBlocks.nextPanel(1); else if (open.length) showFile(open[(open.indexOf(active) + 1) % open.length]); },
  prevTab() { if (mode === 'blocks') ThorBlocks.nextPanel(-1); else if (open.length) showFile(open[(open.indexOf(active) - 1 + open.length) % open.length]); },
  run: () => doRun(),
  toggleMode() { if (files.includes('adventure.json')) setMode(mode === 'blocks' ? 'code' : 'blocks'); },
  keyboard() { if (mode === 'code') $('btnKbd').click(); },
};

/* ---------------- tabs */
function renderTabs() {
  const t = $('tabs'); t.innerHTML = '';
  for (const f of open) {
    const d = document.createElement('div');
    d.className = 'tab' + (f === active ? ' active' : '');
    d.innerHTML = esc(f) + (dirty.has(f) ? '<span class="dot">&#9679;</span>' : '');
    d.onclick = () => showFile(f);
    d.oncontextmenu = (e) => { e.preventDefault(); fileMenu(f); };
    let pressTimer; d.ontouchstart = () => { pressTimer = setTimeout(() => fileMenu(f), 550); };
    d.ontouchend = d.ontouchmove = () => clearTimeout(pressTimer);
    t.appendChild(d);
  }
  const add = document.createElement('div'); add.className = 'tab add'; add.textContent = '+ files';
  add.onclick = filesDialog; t.appendChild(add);
  localStorage['__open_' + project] = JSON.stringify(open);
}
function showFile(f) {
  if (active && active !== f) drafts[active] = code.value;
  active = f;
  if (!f) { code.value = ''; render(); renderTabs(); return; }
  if (!open.includes(f)) open.push(f);
  code.value = isMedia(f) ? '// ' + f + ' is a media file (photo / GIF / video). Use it from the Blocks view.' : (f in drafts) ? drafts[f] : Native.read(project, f);
  code.readOnly = isMedia(f);
  localStorage['__active_' + project] = f;
  render(); renderTabs();
  code.focus();
}

/* ---------------- saving */
const isMedia = (f) => /^media\//.test(f || '');
function markDirty() {
  if (!active || isMedia(active)) return;
  dirty.add(active); drafts[active] = code.value;
  renderTabs(); setStatus('unsaved');
  clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 800);
}
function flushSave() {
  clearTimeout(saveTimer);
  if (active) drafts[active] = code.value;
  let n = 0;
  for (const f of [...dirty]) {
    if (Native.write(project, f, drafts[f] ?? '')) { dirty.delete(f); n++; }
    else setStatus('save failed: ' + f, 'error');
  }
  if (n) setStatus('saved ' + new Date().toLocaleTimeString(), 'saved');
  renderTabs();
}

/* ---------------- editor rendering (overlay highlighter) */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function lang(f) { if (!f) return 'txt'; const e = f.split('.').pop().toLowerCase(); return e === 'htm' ? 'html' : e; }
const JS_KW = /^(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|this|import|export|from|default|try|catch|finally|throw|async|await|typeof|instanceof|of|in|null|undefined|true|false|static|get|set|yield|super|delete|void)$/;
function highlightJS(s) {
  return s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(\d+(?:\.\d+)?)\b|([{}()[\];,.=+\-*/%<>!&|?:]+)|([A-Za-z_$][\w$]*)|([^]|)/g,
    (m, c, str, num, pun, id, other) => c != null ? '<span class="com">' + esc(c) + '</span>'
      : str != null ? '<span class="str">' + esc(str) + '</span>'
      : num != null ? '<span class="num">' + num + '</span>'
      : pun != null ? '<span class="pun">' + esc(pun) + '</span>'
      : id != null ? (JS_KW.test(id) ? '<span class="kw">' + id + '</span>' : id)
      : esc(other));
}
function highlightCSS(s) {
  return esc(s).replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="com">$1</span>')
    .replace(/([.#]?[\w-]+)(\s*\{)/g, '<span class="tag">$1</span>$2')
    .replace(/([\w-]+)(\s*:)(?![^{]*\{)/g, '<span class="attr">$1</span>$2')
    .replace(/(#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|deg)?)/g, '<span class="num">$1</span>');
}
function highlightHTML(s) {
  let out = '', i = 0;
  const re = /<!--[\s\S]*?-->|<(script|style)\b[^>]*>[\s\S]*?<\/\1\s*>|<\/?[a-zA-Z][^>]*>/g; let m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(i, m.index)); const t = m[0];
    if (t.startsWith('<!--')) out += '<span class="com">' + esc(t) + '</span>';
    else if (m[1]) {
      const openEnd = t.indexOf('>') + 1, closeStart = t.lastIndexOf('</');
      out += tagHTML(t.slice(0, openEnd)) + (m[1] === 'script' ? highlightJS(t.slice(openEnd, closeStart)) : highlightCSS(t.slice(openEnd, closeStart))) + tagHTML(t.slice(closeStart));
    } else out += tagHTML(t);
    i = m.index + t.length;
  }
  return out + esc(s.slice(i));
}
function tagHTML(t) {
  // attributes first, then the tag name: the second pass is anchored at ^ so it never touches inserted markup
  return esc(t).replace(/\s([\w-]+)(=)("[^"]*"|'[^']*'|[^\s&>]+)/g, ' <span class="attr">$1</span>$2<span class="str">$3</span>')
    .replace(/^(&lt;\/?)([\w-]+)/, '$1<span class="tag">$2</span>');
}
function render() {
  const s = code.value, l = lang(active);
  let h = l === 'js' ? highlightJS(s) : l === 'css' ? highlightCSS(s) : l === 'html' ? highlightHTML(s) : esc(s);
  hl.innerHTML = h + '\n';
  const n = s.split('\n').length;
  let g = ''; for (let i = 1; i <= n; i++) g += i + '\n';
  gutter.textContent = g;
  syncScroll();
}
function syncScroll() { gutter.scrollTop = scroller.scrollTop; }
scroller.addEventListener('scroll', syncScroll);
code.addEventListener('input', () => { render(); markDirty(); });
new ResizeObserver(() => { code.style.height = hl.offsetHeight + 'px'; }).observe(hl);

/* ---------------- editing helpers: insert text, tab, auto-indent, auto-close */
function insert(text, cursorBack = 0) {
  const s = code.selectionStart, e = code.selectionEnd;
  code.setRangeText(text, s, e, 'end');
  if (cursorBack) code.selectionStart = code.selectionEnd = code.selectionEnd - cursorBack;
  code.dispatchEvent(new Event('input'));
  code.focus();
}
const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
code.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); insert('  '); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const before = code.value.slice(0, code.selectionStart);
    const line = before.slice(before.lastIndexOf('\n') + 1);
    const ind = (line.match(/^\s*/) || [''])[0];
    const extra = /[{(\[>]\s*$/.test(line) && !/^\s*<\//.test(line) ? '  ' : '';
    const after = code.value.slice(code.selectionEnd);
    if (extra && /^\s*[}\])]/.test(after)) insert('\n' + ind + extra + '\n' + ind, ind.length + 1);
    else insert('\n' + ind + extra);
  }
  else if ((e.key === ')' || e.key === ']' || e.key === '}') && code.selectionStart === code.selectionEnd && code.value[code.selectionStart] === e.key) {
    e.preventDefault(); code.selectionStart = code.selectionEnd = code.selectionStart + 1;
  }
  else if (PAIRS[e.key] && code.selectionStart === code.selectionEnd) {
    const next = code.value[code.selectionStart];
    if ((e.key === '"' || e.key === "'" || e.key === '`') && next === e.key) { e.preventDefault(); code.selectionStart = code.selectionEnd = code.selectionStart + 1; return; }
    if (!next || /[\s)\]};,>]/.test(next)) { e.preventDefault(); insert(e.key + PAIRS[e.key], 1); }
  }
  else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); flushSave(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doRun(); }
});

/* ---------------- on-screen keyboard */
const ROWS = [
  ['esc', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', '⌫'],
  ['⇥', 'q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', '[', ']', '\\'],
  ['⇧', 'a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', "'", '⏎'],
  ['sym', 'z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/', '←', '→'],
  ['←←', 'space', '< >', '( )', '{ }', '" "', '=>', '↑', '↓'],
];
const SHIFT = { '1':'!', '2':'@', '3':'#', '4':'$', '5':'%', '6':'^', '7':'&', '8':'*', '9':'(', '0':')', '-':'_', '=':'+', '[':'{', ']':'}', '\\':'|', ';':':', "'":'"', ',':'<', '.':'>', '/':'?' };
let shift = false;
function buildKbd() {
  const k = $('kbd'); k.innerHTML = '';
  for (const row of ROWS) {
    const r = document.createElement('div'); r.className = 'krow';
    for (const key of row) {
      const b = document.createElement('div'); b.className = 'k';
      if (['esc','⌫','⇥','⇧','sym','⏎','←','→','↑','↓','←←'].includes(key)) b.className += ' fn';
      if (key === 'space') b.className += ' space';
      if (['⌫','⇧','⏎','sym','esc'].includes(key)) b.className += ' w';
      b.dataset.k = key; b.textContent = key === 'space' ? '' : key;
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); keyPress(key, b); });
      r.appendChild(b);
    }
    k.appendChild(r);
  }
}
function keyPress(key, el) {
  const v = code.value, s = code.selectionStart, e = code.selectionEnd;
  switch (key) {
    case '⌫': if (s !== e) code.setRangeText('', s, e, 'end'); else if (s > 0) code.setRangeText('', s - 1, s, 'end'); code.dispatchEvent(new Event('input')); break;
    case '⇥': insert('  '); break;
    case '⏎': code.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', cancelable: true })); break;
    case '⇧': shift = !shift; document.querySelectorAll('#kbd .k').forEach(x => { const kk = x.dataset.k; if (kk.length === 1) x.textContent = shift ? (SHIFT[kk] || kk.toUpperCase()) : kk; }); el.classList.toggle('held', shift); return;
    case 'sym': insert('`${}`', 2); break;
    case 'esc': $('kbd').classList.remove('on'); break;
    case '←': if (s > 0) code.selectionStart = code.selectionEnd = s - 1; break;
    case '→': code.selectionStart = code.selectionEnd = e + 1; break;
    case '←←': { const ls = v.lastIndexOf('\n', s - 1) + 1; code.selectionStart = code.selectionEnd = ls; break; }
    case '↑': case '↓': { const ls = v.lastIndexOf('\n', s - 1) + 1, col = s - ls; let t;
      if (key === '↑') { if (ls === 0) return; const pls = v.lastIndexOf('\n', ls - 2) + 1; t = Math.min(pls + col, ls - 1); }
      else { const ne = v.indexOf('\n', s); if (ne < 0) return; const nle = v.indexOf('\n', ne + 1); t = Math.min(ne + 1 + col, nle < 0 ? v.length : nle); }
      code.selectionStart = code.selectionEnd = t; break; }
    case 'space': insert(' '); break;
    case '< >': insert('<>', 1); break;
    case '( )': insert('()', 1); break;
    case '{ }': insert('{}', 1); break;
    case '" "': insert('""', 1); break;
    case '=>': insert(' => '); break;
    default: { let ch = key; if (shift) { ch = SHIFT[key] || key.toUpperCase(); shift = false; document.querySelectorAll('#kbd .k').forEach(x => { const kk = x.dataset.k; if (kk.length === 1) x.textContent = kk; x.classList.remove('held'); }); }
      if (PAIRS[ch]) insert(ch + PAIRS[ch], 1); else insert(ch); }
  }
  code.focus();
}
$('btnKbd').onclick = () => { $('kbd').classList.toggle('on'); code.focus(); };

/* ---------------- console */
function log(level, screen, msg) {
  const l = $('log'); const d = document.createElement('div'); d.className = 'l ' + (level || 'log');
  d.innerHTML = '<span class="tag">' + esc(String(screen || '')) + '</span>' + esc(String(msg));
  l.appendChild(d); l.scrollTop = l.scrollHeight;
  while (l.children.length > 300) l.removeChild(l.firstChild);
}
$('btnClear').onclick = () => $('log').innerHTML = '';
$('btnCon').onclick = () => { const c = $('console'); c.classList.toggle('collapsed'); $('btnCon').innerHTML = c.classList.contains('collapsed') ? '&#9650;' : '&#9660;'; };
$('btnEval').onclick = () => { const js = $('evalIn').value.trim(); if (!js) return; log('info', '>', js); Native.evalInPreview(js); };
$('evalIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnEval').onclick(); });

/* ---------------- actions */
function generateIfBlocks() {
  if (!files.includes('adventure.json')) return true;
  const engine = Native.readAsset('engine/adventure.js');
  if (!engine) { Native.toast('adventure.js asset missing'); return false; }
  if (!ThorBlocks.isOpen()) ThorBlocks.open(project, Native.read(project, 'adventure.json'));
  const out = ThorBlocks.generate(engine);
  for (const f in out) { Native.write(project, f, out[f]); if (!files.includes(f)) files.push(f); delete drafts[f]; dirty.delete(f); }
  files.sort();
  if (mode === 'code' && active && out[active]) showFile(active);
  return true;
}
function doRun() { flushSave(); if (!generateIfBlocks()) return; $('log').innerHTML = ''; Native.run(); setStatus('running', 'saved'); }
$('btnRun').onclick = doRun;
$('btnRunDual').onclick = () => { flushSave(); if (!generateIfBlocks()) return; if (!files.includes('bottom.html')) { Native.toast('No bottom.html in this project'); return; } $('log').innerHTML = ''; Native.runDual(); };
$('btnSave').onclick = flushSave;
$('btnSwap').onclick = () => { flushSave(); Native.swap(); };
$('project').onclick = projectPicker;

function updateScreens(s) {
  $('btnSwap').style.display = s.dual ? '' : 'none';
  $('btnRunDual').style.display = s.dual ? '' : '';
  $('conTitle').textContent = s.dual ? ('console · editor on ' + (s.editorOnMain ? 'top' : 'bottom') + ' screen') : 'console · single screen';
}

/* ---------------- dialogs */
function modalOpen() { return $('modal').classList.contains('on'); }
function closeModal() { $('modal').classList.remove('on'); code.focus(); }
function showModal(html, wire) { $('modalBox').innerHTML = html; $('modal').classList.add('on'); wire && wire(); }
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });

function confirmModal(msg, cb) {
  showModal('<h3>' + esc(msg) + '</h3><div class="row"><button id="ok" style="color:var(--err)">Yes</button><button id="cl">Cancel</button></div>', () => {
    $('cl').onclick = closeModal; $('ok').onclick = () => { closeModal(); cb(); };
  });
}
function askModal(title, value, cb) { ThorBlocks.askText(title, value, cb); }

function filesDialog() {
  const items = files.map(f => '<button data-f="' + esc(f) + '">' + esc(f) + (open.includes(f) ? ' <span class="muted">(open)</span>' : '') + '</button>').join('');
  showModal('<h3>Files in ' + esc(project) + '</h3><div class="list">' + items + '</div>'
    + '<div class="row"><button id="mk" class="acc">New file…</button><button id="cl">Close</button></div>', () => {
    document.querySelectorAll('#modal .list button').forEach(b => b.onclick = () => { closeModal(); showFile(b.dataset.f); });
    $('mk').onclick = () => { closeModal(); askModal('New file name (e.g. app.js)', '', (n) => { if (!n) return; if (!files.includes(n)) { Native.write(project, n, ''); files.push(n); files.sort(); } showFile(n); }); };
    $('cl').onclick = closeModal;
  });
}
function fileMenu(f) {
  showModal('<h3>' + esc(f) + '</h3><div class="list"><button id="cls">Close tab</button><button id="rn">Rename…</button><button id="rm" style="color:var(--err)">Delete file</button></div><div class="row"><button id="cl">Cancel</button></div>', () => {
    $('cl').onclick = closeModal;
    $('cls').onclick = () => { closeModal(); if (dirty.has(f)) flushSave(); open = open.filter(x => x !== f); delete drafts[f]; if (active === f) active = open[0] || null; if (active) showFile(active); else { code.value = ''; render(); renderTabs(); } };
    $('rn').onclick = () => askModal('Rename ' + f, f, (to) => { if (!to || to === f) return; flushSave(); if (Native.rename(project, f, to)) { files = files.map(x => x === f ? to : x); open = open.map(x => x === f ? to : x); if (active === f) active = to; renderTabs(); showFile(active); } else Native.toast('Rename failed'); });
    $('rm').onclick = () => confirmModal('Delete ' + f + '?', () => { Native.del(project, f); dirty.delete(f); delete drafts[f]; files = files.filter(x => x !== f); open = open.filter(x => x !== f); if (active === f) { active = open[0] || null; } if (active) showFile(active); else { code.value = ''; render(); renderTabs(); } });
  });
}
$('btnProjMenu').onclick = () => {
  const canExport = Native.canExport();
  showModal('<h3>Project: ' + esc(project || '') + '</h3><div class="list"><button id="np">New project…</button><button id="sw">Switch project…</button>'
    + (canExport ? '<button id="ex" class="acc">Export as app (APK)…</button>' : '')
    + '<button id="dp" style="color:var(--err)">Delete "' + esc(project) + '"</button></div>'
    + '<p class="muted">Projects folder:<br>' + esc(Native.projectsDir()) + '</p><div class="row"><button id="cl">Close</button></div>', () => {
    $('cl').onclick = closeModal;
    $('np').onclick = () => { closeModal(); newProjectDialog(); };
    $('sw').onclick = () => { closeModal(); projectPicker(); };
    if (canExport) $('ex').onclick = () => { closeModal(); exportDialog(); };
    $('dp').onclick = () => confirmModal('Delete project "' + project + '" and all its files?', () => { Native.deleteProject(project); loadProjects(); });
  });
};
const TEMPLATES = [['adventure-blank', 'Adventure – empty (point & click, no typing needed)'], ['adventure', 'Adventure – example "The Room"'], ['dual', 'Dual-screen web app (index.html + bottom.html)'], ['blank', 'Blank single page']];
function newProjectDialog() {
  askModal('Project name', '', (n) => {
    n = (n || '').trim().replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 64);
    if (!n) return;
    if (Native.listProjects().includes(n)) { Native.toast('There is already a project called ' + n); return; }
    ThorBlocks.pick('What kind of project?', TEMPLATES, (t) => {
      if (!Native.createProject(n, t)) { Native.toast('Could not create the project'); return; }
      flushSave(); loadProjects(); switchProject(n); $('project').textContent = n;
    });
  });
}
/* ---------------- export as a standalone app */
function exportDialog() {
  if (!files.includes('adventure.json') && !files.includes('index.html')) { Native.toast('Nothing to export yet'); return; }
  askModal('App name (shown on the home screen)', project, (label) => {
    if (!label) return;
    flushSave(); if (!generateIfBlocks()) return;
    showModal('<h3>Building ' + esc(label) + '…</h3><p class="muted">Packing the game into an APK and signing it. A few seconds.</p>');
    Native.exportApk(project, label);
  });
}
function onExported(r) {
  if (!r.ok) { showModal('<h3>Export failed</h3><p class="muted">' + esc(String(r.error || 'unknown error')) + '</p><div class="row"><button id="cl">Close</button></div>', () => $('cl').onclick = closeModal); return; }
  showModal('<h3>App ready</h3><p class="muted">' + esc(r.path) + ' (' + Math.round((r.size || 0) / 1024) + ' KB)' + (r.downloads ? '<br>Also saved to ' + esc(r.downloads) : '') + '</p>'
    + '<p class="muted">Tap Install. The first time, Android asks you to allow Thor IDE to install apps — allow it, then come back and tap Install again.</p>'
    + '<div class="row"><button id="inst" class="acc">Install</button><button id="cl">Later</button></div>', () => {
    $('cl').onclick = closeModal;
    $('inst').onclick = () => { Native.installApk(r.path); };
  });
}
$('btnMore').onclick = () => {
  const s = Native.screens();
  showModal('<h3>Thor IDE</h3><p class="muted">Second screen: ' + (s.dual ? ('yes (' + esc(String(s.secondDisplayName || s.secondDisplayId)) + ')') : 'not detected') + '<br>Mode: ' + esc(s.mode || '') + '</p>'
    + '<div class="list"><button id="fs">Font size: ' + fontSize + 'px (tap to cycle)</button><button id="help">How to build dual-screen apps</button></div><div class="row"><button id="cl">Close</button></div>', () => {
    $('cl').onclick = closeModal;
    $('fs').onclick = () => { fontSize = fontSize >= 20 ? 11 : fontSize + 1; applyFont(); $('fs').textContent = 'Font size: ' + fontSize + 'px (tap to cycle)'; };
    $('help').onclick = () => showModal(HELP + '<div class="row"><button id="cl">Close</button></div>', () => $('cl').onclick = closeModal);
  });
};
const HELP = `<h3>Dual-screen apps</h3><p class="muted" style="font-size:12px;line-height:1.5">
<b>Adventures</b> (projects with adventure.json) are built in the Blocks view: scenes with things to tap, Scratch-style blocks (say, show picture, ask, if, go to scene, give item…), variables and items. Run generates index.html, bottom.html and adventure.js. Top screen = the scene, bottom screen = dialog, choices and inventory. Controller: D-pad moves the focus, A selects, B back, L1/R1 switch panels, START runs, SELECT toggles Blocks/Code.<br><br><b>My blocks</b> are reusable stacks: build one once, then use the <b>run [name]</b> block anywhere.<br><b>Export as app</b> (project menu ⋮) packs a finished game into its own APK and installs it, so each game gets its own icon on the Thor.<br><br>
A project is plain HTML/CSS/JS. <b>index.html</b> runs on the top screen, <b>bottom.html</b> on the bottom screen.<br><br>
<b>Run</b> reloads index.html on the other screen while you keep editing.<br>
<b>Dual</b> runs both pages full-screen; press the floating "Editor" button or Back to return.<br><br>
Talk between screens with <code>ThorNative</code>:<br>
<code>ThorNative.send(JSON.stringify({type:'hp', value: 42}))</code><br>
<code>window.onThorMessage = (m) =&gt; { ... }</code><br>
<code>ThorNative.screen()</code> → "top" | "bottom"<br>
<code>ThorNative.isDual()</code> → true/false<br><br>
console.log / errors from both screens show in this console. Files are in Android/data/dev.thor.ide/files/projects.
</p>`;
let fontSize = +(localStorage.__fs || 14);
function applyFont() { document.documentElement.style.setProperty('--fs', fontSize + 'px'); localStorage.__fs = fontSize; render(); }

/* ---------------- boot */
buildKbd(); applyFont(); loadProjects(); updateScreens(Native.screens());
window.addEventListener('beforeunload', flushSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
</script>
