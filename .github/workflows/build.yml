name: Build Thor IDE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # 1. The game "player" (standalone runtime) - Thor IDE bundles it and turns it into a new
      #    APK per exported game, on the device.
      - name: Build game player
        run: gradle --no-daemon :player:assembleRelease

      # 2. Signing material for on-device exports, taken from the same committed hobby keystore.
      - name: Bundle player + signing key into the IDE
        run: |
          mkdir -p app/src/main/assets/signing
          cp player/build/outputs/apk/release/player.apk app/src/main/assets/player.apk
          keytool -importkeystore -srckeystore keystore/thor-ide.jks -srcstorepass thor-ide -srcalias thor \
            -destkeystore /tmp/k.p12 -deststoretype PKCS12 -deststorepass thor-ide -noprompt
          openssl pkcs12 -in /tmp/k.p12 -passin pass:thor-ide -nocerts -nodes -out /tmp/key.pem
          openssl pkcs8 -topk8 -nocrypt -in /tmp/key.pem -outform DER -out app/src/main/assets/signing/key.pk8
          openssl pkcs12 -in /tmp/k.p12 -passin pass:thor-ide -nokeys -out /tmp/cert.pem
          openssl x509 -in /tmp/cert.pem -outform DER -out app/src/main/assets/signing/cert.der
          ls -la app/src/main/assets/player.apk app/src/main/assets/signing

      # 3. The IDE itself.
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ThorIDE.apk
          ls -la out

      # Always available from the Actions tab (zip download, needs GitHub login).
      - uses: actions/upload-artifact@v4
        with:
          name: ThorIDE-apk
          path: out/ThorIDE.apk

      # Direct-download link, no login needed on the Thor:
      #   https://github.com/<you>/<repo>/releases/download/latest/ThorIDE.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Automatic build of the newest commit." --latest
          gh release upload latest out/ThorIDE.apk --clobber
