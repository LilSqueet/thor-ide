name: Build Thor IDE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ThorIDE.apk
          ls -la out

      # Always available from the Actions tab (zip download, needs GitHub login).
      - uses: actions/upload-artifact@v4
        with:
          name: ThorIDE-apk
          path: out/ThorIDE.apk

      # Direct-download link, no login needed on the Thor:
      #   https://github.com/<you>/<repo>/releases/download/latest/ThorIDE.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Automatic build of the newest commit." --latest
          gh release upload latest out/ThorIDE.apk --clobber
